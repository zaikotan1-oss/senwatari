<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="線でわたれ">
<meta name="theme-color" content="#5fb8ff">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>線でわたれ！</title>
<style>
html,body{margin:0;height:100%;background:#1b2838;overflow:hidden;touch-action:none;
  font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#wrap{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden}
#cv{position:absolute;left:0;top:0;width:1280px;height:720px;display:block;cursor:crosshair}
.hud{position:absolute;pointer-events:none}
.btn{pointer-events:auto;touch-action:manipulation;border:0;border-radius:18px;background:#fff;color:#334;font:inherit;font-weight:bold;
  box-shadow:0 5px 0 #0003;cursor:pointer;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0003}
.btn:disabled{opacity:.4;cursor:default}
#top{left:0;right:0;top:0;height:80px}
#stage{position:absolute;left:22px;top:16px;font-size:26px;font-weight:bold;color:#fff;text-shadow:0 2px 0 #0006}
#stage small{display:block;font-size:17px;opacity:.85}
#tools{position:absolute;right:18px;top:14px;display:flex;gap:10px}
#tools .btn{width:62px;height:56px;font-size:28px}
#retryBig{position:absolute;right:26px;bottom:26px;width:210px;height:86px;font-size:34px;background:#ffd23f;color:#334;border-radius:26px;display:none}
#retryBig.show{display:block}
#retryBig.pulse{animation:pulse .7s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.1)}}
#hint{position:absolute;left:24px;bottom:22px;max-width:760px;color:#fff;font-size:20px;font-weight:bold;
  text-shadow:0 2px 0 #0007;background:#0003;padding:8px 16px;border-radius:14px}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0008;pointer-events:auto}
.ov.show{display:flex}
.card{background:#fff;border-radius:30px;padding:34px 46px;text-align:center;min-width:420px;box-shadow:0 10px 0 #0004}
.card h1{margin:0 0 6px;font-size:52px;color:#ff5a4e}
.card h2{margin:0 0 10px;font-size:40px;color:#334}
.card p{margin:6px 0 18px;font-size:21px;color:#556}
.card .btn{font-size:26px;padding:14px 30px;margin:6px;background:#ffd23f}
.card .btn.sub{background:#e4e8f0}
#pager{display:flex;align-items:center;justify-content:center;gap:18px;font-size:24px;font-weight:bold;color:#556}
#pager .btn{width:64px;height:52px;padding:0;margin:0;font-size:32px}
#grid{display:grid;grid-template-columns:repeat(5,110px);gap:14px;margin:14px 0 20px;justify-content:center}
#grid .btn{height:100px;font-size:36px;background:var(--wc,#8fd3ff);color:#fff;text-shadow:0 2px 0 #0005;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#grid .btn span{font-size:18px;color:#fff;text-shadow:0 2px 0 #3a7}
#titleOv{background:linear-gradient(#58b8ff,#c9ecff)}
#titleOv h1{font-size:96px;color:#fff;text-shadow:0 6px 0 #2f6fd0,0 10px 20px #0004;margin:0}
#titleOv p{font-size:26px;color:#2b4a7a;font-weight:bold}
#titleOv .btn{font-size:36px;padding:18px 60px;background:#ff5a4e;color:#fff}
#toast{position:absolute;left:50%;top:110px;transform:translateX(-50%);background:#000a;color:#fff;font-size:22px;
  padding:8px 20px;border-radius:14px;opacity:0;transition:opacity .2s;font-weight:bold}
#rotate{display:none;position:fixed;inset:0;background:#1b2838;color:#fff;font-size:26px;align-items:center;justify-content:center;text-align:center;z-index:9}
@media (orientation:portrait) and (max-width:700px){#rotate{display:flex}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div class="hud" id="top">
    <div id="stage">STAGE 1<small>はじめの一本</small></div>
    <div id="tools">
      <button class="btn" id="hintBtn" title="ヒント">💡</button>
      <button class="btn" id="retryBtn" title="やり直し">↻</button>
      <button class="btn" id="menuBtn" title="ステージ選択">☰</button>
    </div>
  </div>
  <div class="hud" id="hint"></div>
  <button class="btn" id="retryBig">↻ リトライ</button>
  <div id="toast"></div>

  <div class="ov show" id="titleOv"><div style="text-align:center">
    <h1>線でわたれ！</h1>
    <p>線は一本だけ。指を離した瞬間、線は落ちて車が走り出す。<br>うまく橋をかけて、車を向こう岸まで送りとどけよう。</p>
    <button class="btn" id="startBtn">あそぶ</button>
  </div></div>

  <div class="ov" id="selOv"><div class="card">
    <h2>ステージをえらぶ</h2>
    <div id="pager"><button class="btn sub" id="pgPrev">‹</button><span id="pgLabel"></span><button class="btn sub" id="pgNext">›</button></div>
    <div id="grid"></div>
    <button class="btn sub" id="selBack">もどる</button>
  </div></div>

  <div class="ov" id="resOv"><div class="card">
    <h1 id="resTitle">クリア！</h1>
        <p id="resMsg"></p>
    <div>
      <button class="btn sub" id="resRetry">もう一回</button>
      <button class="btn" id="resNext">次へ ▶</button>
    </div>
  </div></div>
</div>
<div id="rotate">横向きにしてあそんでね</div>

/* 面の部品とクリアの条件（2026-09-28 作り直し）
   L.goals: クリアの条件の並び（全部そろったらクリア）
     "flag"  車が全部旗まで      "guard" L.guard 秒守る（車は止まったまま）
     "wake"  おっさんを全員起こす  "bed"  シーソーで飛ばしたおっさんを布団へ
     "ball"  ボールをカゴへ        "btn"  goal 印のボタンを全部押す
   L.objs: 部品の並び {k:種類, ...}。id を持つ部品は、ボタンの act で動き出す（門が開く・橋が出る・足場が動く・扇風機が回る・目覚ましが鳴る）
     btn gate bridge plat spin conv spring fan grav warp pool balloon domino ball box basket oji saw cannon guy bees lever
     lever {x,y,len,dens,a0}: 真ん中をくぎで留めた板（てこ・シーソー）。btn の side:"d" は天井のボタン（下から押す）。oji の pass:1 は線が通りぬける（当たれば起きる）。btn の by:"thing" は線と車以外だけ。saw の free:1 は布団なし。warp の only:"car"/"ball" は車だけ／ボールだけ通す、stop:1 は出口で止まってまっすぐ落ちる
   古い形（L.mode と L.btns/gate/bridge/oji/saw/bed/cannon）は normalize で部品に直す */
const MODE=(()=>{
  const M={};let FZ=[],P=[],G=[],byId={},flagDone=false,doneT=0,flashT=0,warpCD=new Map(),talkQ=[];
  const dt=()=>DT/1000;
  // ---------- 古い書き方を部品に直す ----------
  function normalize(L){
    if(L._norm)return;L._norm=true;
    const objs=L.objs?[...L.objs]:[];let goals=L.goals?[...L.goals]:null;
    if(L.mode==="switch"){const ids=[];
      if(L.gate){objs.push({k:"gate",id:"g0",x:L.gate[0],top:L.gate[1],bot:L.gate[2]});ids.push("g0");}
      if(L.bridge){objs.push({k:"bridge",id:"b0",x0:L.bridge[0],x1:L.bridge[1],y:L.bridge[2]});ids.push("b0");}
      for(const [x,y,w] of (L.btns||[]))objs.push({k:"btn",x,y,w,by:"line",act:ids,all:true});

    if(L.mode==="guard"){if(L.cannon)objs.push({k:"cannon",x:L.cannon[0],y:L.cannon[1],vx:L.cannon[2],vy:L.cannon[3],iv:L.cannon[4],delay:L.cannon[5]});goals=goals||["guard"];}
    if(L.mode==="wake"){objs.push({k:"oji",x:L.oji[0],y:L.oji[1]});goals=goals||["wake"];L.car=null;}
    if(L.mode==="launch"){objs.push({k:"saw",x:L.saw[0],y:L.saw[1],len:L.saw[2],dir:L.sawDir||1,bed:L.bed});goals=goals||["bed"];L.car=null;}

  M.prep=L=>{normalize(L);if(!L.car){L.car=[-400,300];L.nocar=true;}
    if(!L.goal){const t=L.objs.find(o=>o.k==="oji"||o.k==="guy"||o.k==="basket");L.goal=t?[t.x!==undefined?t.x:(t.x0+t.x1)/2,t.y]:[W/2,400];}};
  M.noCar=()=>!!(L&&L.nocar);
  M.has=g=>L&&L.goals&&L.goals.includes(g);
  M.flag=()=>M.has("flag");
  M.driveOff=()=>!M.has("flag")||P.some(o=>o.k==="plat"&&o.ride&&o.go&&o.ph<1)
    ||L.goals.length>1&&cars.every(c=>!c.waiting&&(c.chassis.position.x-L.goal[0])*DIR>0); // 旗に着いたら止まって、ほかの条件を待つ // エレベーターで運ばれている間は待つ
  M.flagDone=v=>{flagDone=v;};
  // ---------- 作る ----------
  const ST=(b)=>{Composite.add(world,b);return b;};
  M.load=()=>{P=[];FZ=[];byId={};flagDone=false;doneT=0;flashT=0;warpCD=new Map();
    if(L.nocar)for(const c of cars)for(const b of [c.chassis,c.wA,c.wB])Body.setStatic(b,true);
    for(const o0 of L.objs){const o={...o0,on:o0.on!==undefined?o0.on:!o0.id||o0.k==="oji"||o0.k==="fan"&&o0.on!==false,t:0};
      if(o.k==="fan"||o.k==="plat"||o.k==="spin")o.on=o0.on!==undefined?o0.on:!o0.id;
      MAKE[o.k]&&MAKE[o.k](o);P.push(o);
      if(!o.live)for(const b of [o.body,o.box,o.ball,...(o.bodies||[])])if(b&&!b.isStatic&&(o.k==="ball"||o.k==="box"||o.k==="domino"||o.k==="balloon"||o.k==="lever")){Body.setStatic(b,true);FZ.push(b);}if(o.id)(byId[o.id]=byId[o.id]||[]).push(o);}
  };
  const MAKE={
    btn(o){o.w=o.w||64;o.down=false;},
    gate(o){o.body=ST(Bodies.rectangle(o.x,(o.top+o.bot)/2,30,o.bot-o.top,{isStatic:true,friction:.5}));o.y0=o.body.position.y;},
    bridge(o){o.k2=0;o.body=null;},
    plat(o){o.w=o.w||140;o.h=o.h||18;o.a=[o.x,o.y];o.b=o.to;o.T=o.T||3;o.ph=0;
      o.body=ST(Bodies.rectangle(o.x,o.y+o.h/2,o.w,o.h,{isStatic:true,friction:1,frictionStatic:4}));},
    spin(o){o.len=o.len||200;o.av=o.av||1.2;
      const parts=[Bodies.rectangle(o.x,o.y,o.len,16)];if(o.cross)parts.push(Bodies.rectangle(o.x,o.y,16,o.len));
      o.body=ST(Body.create({parts,isStatic:true,friction:.6}));Body.setAngle(o.body,o.a0||0);},
    conv(o){o.body=ST(Bodies.rectangle((o.x0+o.x1)/2,o.y+10,o.x1-o.x0,20,{isStatic:true,friction:1,frictionStatic:3}));},
    spring(o){o.w=o.w||70;o.v=o.v||17;o.vx=o.vx||0;o.sq=0;o.body=ST(Bodies.rectangle(o.x,o.y-7,o.w,14,{isStatic:true,friction:.8}));o.body.plugin.spring=o;},
    fan(o){},grav(o){},warp(o){o.r=o.r||36;},pool(o){},
    balloon(o){o.r=o.r||28;o.lift=o.lift||1.7;
      o.box=Bodies.rectangle(o.x,o.y+(o.rope||90),o.bw||40,o.bh||40,{density:.004,friction:.8});
      o.ball=Bodies.circle(o.x,o.y,o.r,{density:.0008,frictionAir:.04,restitution:.2});o.ball.plugin.balloon=o;
      o.rope=Constraint.create({bodyA:o.ball,bodyB:o.box,pointB:{x:0,y:-(o.bh||40)/2},length:o.rope||90,stiffness:.9});

    domino(o){o.bodies=[];const w=o.w||14,h=o.h||80;for(let i=0;i<(o.n||5);i++)o.bodies.push(ST(Bodies.rectangle(o.x+i*(o.gap||50)*(o.dir||1),o.y-h/2,w,h,{density:.002,friction:.5})));},
    ball(o){o.r=o.r||18;o.body=ST(Bodies.circle(o.x,o.y,o.r,{density:o.dens||.002,friction:.05,frictionStatic:.1,restitution:.3}));o.body.plugin.ballId=o.id||"ball";},
    lever(o){o.len=o.len||300;o.body=Bodies.rectangle(o.x,o.y,o.len,14,{density:o.dens||.003,friction:.8,frictionStatic:2});Body.setAngle(o.body,o.a0||0); // てこ: 真ん中をくぎで留めた板
      o.pin=Constraint.create({pointA:{x:o.x,y:o.y},bodyB:o.body,pointB:{x:0,y:0},length:0,stiffness:1});Composite.add(world,[o.body,o.pin]);},
    box(o){o.body=ST(Bodies.rectangle(o.x,o.y,o.w||50,o.h||50,{density:o.dens||.002,friction:.7}));},
    basket(o){const {x0,x1,y}=o;o.bodies=[ST(Bodies.rectangle((x0+x1)/2,y+6,x1-x0,12,{isStatic:true})),ST(Bodies.rectangle(x0,y-30,12,72,{isStatic:true})),ST(Bodies.rectangle(x1,y-30,12,72,{isStatic:true}))];o.done=0;},
    oji(o){o.body=ST(Bodies.rectangle(o.x,o.y+(o.flip?15:-15),120,30,{isStatic:true,friction:.8,isSensor:!!o.pass}));o.body.plugin.oji=o;o.woke=0;o.on=true;},
    saw(o){const sd=o.dir||1;o.body=ST(Bodies.rectangle(o.x,o.y,o.len,14,{isStatic:true,friction:1,frictionStatic:3,collisionFilter:{category:0x0004}}));o.body.plugin.saw=o;
      const fx=o.x-sd*(o.len/2-26);
      o.rider=Body.create({parts:[Bodies.rectangle(fx,o.y-24,30,34),Bodies.circle(fx,o.y-52,14)],density:.0012,friction:1,frictionStatic:4,restitution:.05});
      o.rider.plugin.rider=o;Composite.add(world,o.rider);Body.setStatic(o.rider,true);o.fired=0;o.a=0;o.landT=0;o.still=0;
      const [x0,x1,y]=o.bed,wall=x=>Bodies.rectangle(x,y-22,14,44,{isStatic:true});
      o.bedB=[ST(Bodies.rectangle((x0+x1)/2,y+6,x1-x0,12,{isStatic:true,friction:1})),ST(wall(x0)),ST(wall(x1))];},
    cannon(o){o.cd=o.delay||.6;},
    guy(o){o.body=ST(Bodies.rectangle(o.x,o.y-40,40,80,{isStatic:true}));o.body.plugin.guy=o;},
    bees(o){o.cd=o.delay||.4;o.left=o.n||8;o.list=[];},
  };
  M.go=()=>{for(const b of FZ)Body.setStatic(b,false);FZ=[];}; // 線を離したら動き出す
  // ---------- 動かす ----------
  function activate(id){if(id[0]==="!"){for(const o of (byId[id.slice(1)]||[]))o.on=false;tone(200,.3,"square",.05,80);return;} // "!id" は止める
    for(const o of (byId[id]||[])){if(o.on&&o.k!=="oji")continue;
    if(o.k==="oji"){if(!o.woke){o.woke=.001;o.alarm=1;tone(1400,.08,"square",.08);tone(1400,.08,"square",.08,0,.12);tone(1400,.08,"square",.08,0,.24);}continue;}
    o.on=true;o.t=0;tone(300,.4,"sawtooth",.05,600);}}
  const dyn=()=>Composite.allBodies(world).filter(b=>!b.isStatic);
  const carOf=b=>cars.find(c=>!c.waiting&&(b===c.chassis||b===c.wA||b===c.wB));
  function moveCar(c,dx,dy){for(const b of [c.chassis,c.wA,c.wB])Body.setPosition(b,{x:b.position.x+dx,y:b.position.y+dy});}
  function touching(o,bd,by){ // ボタンの上に何か乗っているか
    for(const b of dyn()){if(by==="line"&&!strokes.some(s=>s.body===b))continue;if(by==="thing"&&(strokes.some(s=>s.body===b)||carOf(b)))continue;if(b.plugin&&(b.plugin.balloon))continue;
      const parts=b.parts.length>1?b.parts.slice(1):[b];if(Query.region(parts,bd).length)return true;}return false;}
  const KICK=[];
  M.step=()=>{const d=dt();for(const [bs,o] of KICK)for(const b2 of bs)Body.setVelocity(b2,{x:b2.velocity.x+o.vx,y:-o.v});KICK.length=0;if(flashT>0)flashT-=d;
    const running=state==="go";
    for(const o of P){o.t+=d;
      if(o.k==="btn"&&!o.down&&running){const bd=o.side==="l"?{min:{x:o.x-20,y:o.y-o.w/2},max:{x:o.x+2,y:o.y+o.w/2}}:o.side==="d"?{min:{x:o.x-o.w/2,y:o.y-2},max:{x:o.x+o.w/2,y:o.y+20}}:{min:{x:o.x-o.w/2,y:o.y-20},max:{x:o.x+o.w/2,y:o.y+2}}; // side:"l" は壁の左面のボタン
        if(touching(o,bd,o.by)){o.down=true;tone(660,.1,"square",.08);tone(990,.15,"square",.08,0,.1);
          const grp=P.filter(q=>q.k==="btn"&&q.all&&q.act+""===o.act+"");
          if(!o.all||grp.every(q=>q.down))(o.act||[]).forEach(activate);}}
      if(o.k==="gate"&&o.on){const lift=Math.min(1,o.t/.6)*(o.bot-o.top+20);Body.setPosition(o.body,{x:o.x,y:o.y0-lift});}
      if(o.k==="bridge"&&o.on&&o.k2<1){o.k2=Math.min(1,o.t/.5);const len=o.x1-o.x0,cx=o.x0+len/2,sd=o.from==="r"?-1:1;
        if(!o.body){o.body=ST(Bodies.rectangle(cx,o.y+10,len,20,{isStatic:true,friction:.9,frictionStatic:2}));}
        Body.setPosition(o.body,{x:cx-(1-o.k2)*len*sd,y:o.y+10});}
      if(o.k==="plat"&&o.on&&running&&o.ride&&!o.go){const b=o.body.bounds; // 車が乗ったら動き出す
        if(cars.some(c=>!c.waiting&&c.chassis.position.x>b.min.x+20&&c.chassis.position.x<b.max.x-20&&Math.abs(c.chassis.position.y-b.min.y)<70))o.go=1;}
      if(o.k==="plat"&&o.on&&running&&(!o.ride||o.go)){o.ph+=d/o.T;let u=o.once?Math.min(1,o.ph):(1-Math.cos(o.ph*Math.PI))/2;if(o.once)u=(1-Math.cos(u*Math.PI))/2;
        const x=o.a[0]+(o.b[0]-o.a[0])*u,y=o.a[1]+(o.b[1]-o.a[1])*u+o.h/2,pv={...o.body.position};
        Body.setPosition(o.body,{x,y});Body.setVelocity(o.body,{x:x-pv.x,y:y-pv.y});
        for(const b of dyn()){if(b.bounds.max.y>o.body.bounds.min.y-6&&b.bounds.max.y<o.body.bounds.min.y+10&&b.position.x>o.body.bounds.min.x-10&&b.position.x<o.body.bounds.max.x+10){
          const c=carOf(b);if(c){if(b===c.chassis)moveCar(c,x-pv.x,y-pv.y);}else if(!b.parent.plugin.rider||!b.isStatic)Body.setPosition(b,{x:b.position.x+x-pv.x,y:b.position.y+Math.min(0,y-pv.y)});}}}
      if(o.k==="spin"&&o.on&&running){const a=o.body.angle+o.av*d;Body.setAngle(o.body,a);Body.setAngularVelocity(o.body,o.av*d);}
      if(o.k==="conv"&&running){const top=o.y;for(const b of dyn()){if(b.bounds.max.y>top-6&&b.bounds.max.y<top+8&&b.position.x>o.x0&&b.position.x<o.x1){
          const c=carOf(b);const vx=b.velocity.x+(o.v-b.velocity.x)*(c?.05:.2);Body.setVelocity(b,{x:vx,y:b.velocity.y});}}}
      if(o.k==="spring")o.sq=Math.max(0,o.sq-d*4);
      if((o.k==="fan"||o.k==="grav")&&(o.on||o.k==="grav")&&(running||o.k==="grav")){
        const gx=o.k==="grav"?o.gx-0:o.fx||0,gy=o.k==="grav"?o.gy-(engine.gravity.y):o.fy||0;
        for(const b of dyn()){const p=b.position;if(p.x>o.x&&p.x<o.x+o.w&&p.y>o.y&&p.y<o.y+o.h){
          if(b.plugin&&b.plugin.balloon)continue;Body.applyForce(b,p,{x:gx*b.mass*.001,y:gy*b.mass*.001});}}}
      if(o.k==="warp"&&running){for(const b of dyn()){const cd=warpCD.get(b.id);if(cd&&cd.o===o&&time<cd.t)continue;/* 同じワープにすぐ戻らない（別のワープには入れる） */if(o.only==="car"&&!carOf(b))continue;if(o.only==="ball"&&!b.plugin.ballId)continue;
        const p=b.position;for(const [A,B] of [[o.a,o.b],[o.b,o.a]]){if(Math.hypot(p.x-A[0],p.y-A[1])<o.r){
          const c=carOf(b);const dx=B[0]-A[0],dy=B[1]-A[1];
          if(c){if(b!==c.chassis)break;moveCar(c,dx,dy);for(const q of [c.chassis,c.wA,c.wB])warpCD.set(q.id,{t:time+.8,o});}
          else{Body.setPosition(b,{x:p.x+dx,y:p.y+dy});if(o.stop)Body.setVelocity(b,{x:0,y:0});warpCD.set(b.id,{t:time+.8,o});}
          tone(900,.15,"sine",.08,300);break;}}}}
      if(o.k==="pool"){for(const b of dyn()){const bb=b.bounds;if(bb.max.x<o.x0||bb.min.x>o.x1||bb.max.y<o.y)continue;
          const h=Math.max(1,bb.max.y-bb.min.y),f=Math.max(0,Math.min(1,(bb.max.y-o.y)/h));

          Body.setVelocity(b,{x:b.velocity.x*(1-.03*f),y:b.velocity.y*(1-.06*f)});}}
      if(o.k==="balloon"&&!o.popped){const k=Math.max(.2,Math.min(1.8,1+(o.ball.position.y-o.y)/40)); // 元の高さでふわふわ止まる
        Body.applyForce(o.ball,o.ball.position,{x:0,y:-k*(o.ball.mass+o.box.mass)*.001*engine.gravity.y});}
      if(o.k==="cannon"&&running&&o.on){o.cd-=d;if(o.cd<=0){o.cd=o.iv||1;flashT=.15;
        const b=Bodies.circle(o.x,o.y,15,{density:.006,restitution:.2,friction:.3,frictionAir:0});b.plugin.rock=true;b.plugin.ball=true;Composite.add(world,b);
        let vy=o.vy;if(vy===null||vy===undefined){const tgt=car.chassis.position,t=Math.max(8,Math.abs((tgt.x-o.x)/o.vx)),g=engine.gravity.y*.001*DT*DT;vy=(tgt.y-10-o.y-.5*g*t*t)/t;}
        Body.setVelocity(b,{x:o.vx,y:vy});rocks.push(b);tone(120,.2,"square",.12,50);}}
      if(o.k==="oji"&&o.woke)o.woke+=d;
      if(o.k==="bees"&&running){o.cd-=d;if(o.cd<=0&&o.left>0&&o.on!==false){o.cd=o.iv||.45;o.left--;
          const b=Bodies.circle(o.x,o.y,9,{density:.001,frictionAir:.02,restitution:.6,friction:0});b.plugin.bee=o;b.plugin.born=time;Composite.add(world,b);o.list.push(b);tone(220,.3,"sawtooth",.02,260);}
        const tg=P.find(q=>q.k==="guy")||{x:car.chassis.position.x,y:car.chassis.position.y+40};
        for(const b of o.list){if(b.plugin.dead&&!b.plugin.gone){b.plugin.gone=1;Composite.remove(world,b);}if(!b.plugin.dead){const p=b.position,dx=tg.x-p.x,dy=tg.y-45-p.y,l=Math.hypot(dx,dy)||1,sp=o.sp||.9;
          // 重さを打ち消して、狙いに向かって飛ぶ（ときどきふらつく）
          Body.applyForce(b,p,{x:b.mass*.001*(dx/l*sp+Math.sin(time*7+b.id)*.6),y:b.mass*.001*(dy/l*sp-engine.gravity.y+Math.cos(time*6+b.id)*.6)});
          const v=b.velocity,vl=Math.hypot(v.x,v.y),mx=o.max||4.5;if(vl>mx)Body.setVelocity(b,{x:v.x/vl*mx,y:v.y/vl*mx});}}}
      if(o.k==="saw"){if(o.fired){o.a=Math.min(1,(time-o.fired)/.12)*.35*(o.dir||1);Body.setAngle(o.body,o.a);}
        if(running&&!o.rider.isStatic){const p=o.rider.position,[x0,x1,y]=o.bed;const inBed=p.x>x0&&p.x<x1&&p.y<y&&p.y>y-90;
          o.landT=inBed?o.landT+d:0;o.still=!inBed&&Math.hypot(o.rider.velocity.x,o.rider.velocity.y)<.25?o.still+d:0;
          if(p.y>WATER_Y+40||p.x<-80||p.x>W+80)return finish(false,"おっさんが飛んでいっちゃった…");

function audio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}

function tone(f,d,type="sine",v=.12,f2=0,delay=0){
  const a=audio();if(!a)return;const t0=a.currentTime+delay;
  const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);

  o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+d+.02);}

function vroom(){

  const lp=a.createBiquadFilter();lp.type="lowpass";lp.Q.value=4;
  lp.frequency.setValueAtTime(300,t);lp.frequency.linearRampToValueAtTime(1400,t+.35);lp.frequency.linearRampToValueAtTime(700,t+D);
  const g=a.createGain();g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.35,t+.06);
  g.gain.setValueAtTime(.35,t+.5);g.gain.exponentialRampToValueAtTime(.001,t+D);

  lfo.frequency.setValueAtTime(18,t);lfo.frequency.linearRampToValueAtTime(45,t+.35);lfo.frequency.linearRampToValueAtTime(35,t+D);
  lfo.connect(lg).connect(am.gain);
  for(const det of [0,7]){
    const o=a.createOscillator();o.type="sawtooth";o.detune.value=det*10;
    o.frequency.setValueAtTime(48,t);o.frequency.exponentialRampToValueAtTime(150,t+.35);o.frequency.exponentialRampToValueAtTime(105,t+D);
    o.connect(am);o.start(t);o.stop(t+D+.05);
  }
  am.connect(lp).connect(g).connect(a.destination);lfo.start(t);lfo.stop(t+D+.05);
}

function convexParts(poly){ // 凸ならそのまま、へこみがあれば耳切りで三角形に
  const cr=(a,b,c)=>(b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0]);
  const n=poly.length;let pos=0,neg=0;for(let i=0;i<n;i++){const c=cr(poly[i],poly[(i+1)%n],poly[(i+2)%n]);if(c>1e-9)pos++;else if(c<-1e-9)neg++;}
  if(!pos||!neg)return [poly];
  let area=0;for(let i=0;i<n;i++){const a=poly[i],b=poly[(i+1)%n];area+=a[0]*b[1]-b[0]*a[1];}
  const sg=area>0?1:-1,v=poly.slice(),out=[];
  const inTri=(p,a,b,c)=>{const d1=cr(a,b,p)*sg,d2=cr(b,c,p)*sg,d3=cr(c,a,p)*sg;return d1>=0&&d2>=0&&d3>=0;};
  let guard=0;while(v.length>3&&guard++<500){let cut=false;
    for(let i=0;i<v.length;i++){const a=v[(i+v.length-1)%v.length],b=v[i],c=v[(i+1)%v.length];

      b.plugin.ice=!!g0.ice;b.plugin.bounce=!!g0.bounce;

  }

  // 風車: くぎで留まった羽根が、力に上限のあるモーターで回る（線がはさまると止まる）
  mill=null;
  if(L.mill){const [mx,my,mr]=L.mill;
    const a=Bodies.rectangle(mx,my,mr*2,16,{density:.003}),b=Bodies.rectangle(mx,my,16,mr*2,{density:.003});
    mill=Body.create({parts:[a,b],friction:.4});
    let I=0;for(const q of mill.parts.slice(1))I+=q.inertia;Body.setInertia(mill,I*1.5);
    Composite.add(world,[mill,Constraint.create({pointA:{x:mx,y:my},bodyB:mill,pointB:{x:0,y:0},length:0,stiffness:.9})]);
    mill.plugin.speed=L.mill[3]||.05;}
  Events.on(engine,"collisionStart",onHit);Events.on(engine,"collisionActive",iceLine);
  MODE.load();
  state="draw";showHint=0;failAt=null;winFx=[];boomFx=[];shakeT=0;blown=false;
  document.getElementById("retryBig").classList.remove("show","pulse");
  document.getElementById("toast").style.opacity=0;
  const lk=LINE_KIND[L.line];
  document.getElementById("stage").innerHTML=`STAGE ${i+1}<small>${L.name}${lk?`　<b style="background:${lk.col[1]};color:${lk.col[0]};border:2px solid ${lk.col[0]};padding:1px 10px;border-radius:12px;font-size:17px;opacity:1">${lk.name}</b>`:""}${L.ink?`　<b style="background:#3fa7ff;color:#fff;padding:1px 10px;border-radius:12px;font-size:17px">インク少し</b>`:""}</small>`;
  document.getElementById("hint").textContent=(lk?`【${lk.name}】`:"")+L.hint;
  if(i%5===0&&i>0)banner(i%10===0?`ワールド${Math.floor(i/10)+1}　${TH.name}`:TH.name);
}
function mulberry(a){return ()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function banner(s){const t=$("toast");t.textContent=s;t.style.opacity=1;t.style.fontSize="34px";clearTimeout(toastT);
  toastT=setTimeout(()=>{t.style.opacity=0;t.style.fontSize="";},2200);}
// 落石: 車や荷物に当たったら失敗。地面に当たったら砕ける
// Matter は毎歩 Pair.update で摩擦を体の値から入れ直すので、そこに割り込んで氷の線を 0 にする
{const pu=Matter.Pair.update;Matter.Pair.update=function(pair,col,ts){pu.call(this,pair,col,ts);const a=pair.bodyA.parent,b=pair.bodyB.parent;
  if((a.plugin.kind==="ice"&&!b.isStatic)||(b.plugin.kind==="ice"&&!a.isStatic)){pair.friction=0;pair.frictionStatic=0;}
};}
// ゴムの線: 当たった動く物の速さを、当たった面で折り返す（Matter の反発は下に物がある線だと効かないので自分で）
let RUB=[];
function rubberHit(ev){for(const pr of ev.pairs){const A=pr.bodyA.parent,B=pr.bodyB.parent;let o=null,part=null;
  if(A.plugin.kind==="rubber"&&!B.isStatic&&!B.plugin.kind){o=B;part=pr.bodyA;}else if(B.plugin.kind==="rubber"&&!A.isStatic&&!A.plugin.kind){o=A;part=pr.bodyB;}
  if(!o||RUB.some(q=>q.o===o))continue;
  // 面の向き: 線の棒なら棒に直角、つなぎ目の丸なら丸の中心から
  const d={x:o.position.x-part.position.x,y:o.position.y-part.position.y};let n;
  if(part.circleRadius){const l=Math.hypot(d.x,d.y)||1;n={x:d.x/l,y:d.y/l};}else{n={x:-Math.sin(part.angle),y:Math.cos(part.angle)};if(n.x*d.x+n.y*d.y<0)n={x:-n.x,y:-n.y};}
  RUB.push({o,n,v:{x:o.velocity.x,y:o.velocity.y},t:time});}}
function rubberApply(){for(const q of RUB){const {o,n,v}=q;const vn=v.x*n.x+v.y*n.y;if(vn>=-.5)continue; // 線に向かって来ていた時だけ
  const k=1.3,nx=v.x-(1+k)*vn*n.x,ny=v.y-(1+k)*vn*n.y;const c=cars.find(c=>c.chassis===o||c.wA===o||c.wB===o);
  if(c){const p=c.chassis.position,z=c.sz; // 車はトランポリンで姿勢がまっすぐに戻る（回ったまま飛ぶと必ずひっくり返るので）
    Body.setAngle(c.chassis,0);Body.setPosition(c.wA,{x:p.x-32*z,y:p.y+WY*z});Body.setPosition(c.wB,{x:p.x+32*z,y:p.y+WY*z});
    for(const b of [c.chassis,c.wA,c.wB]){Body.setVelocity(b,{x:nx,y:ny});Body.setAngularVelocity(b,0);}}
  else Body.setVelocity(o,{x:nx,y:ny});}RUB=[];}
function iceLine(ev){for(const pr of ev.pairs){const a=pr.bodyA.parent,b=pr.bodyB.parent; // 氷の線は、動く物との間だけ摩擦 0
  if((a.plugin.kind==="ice"&&!b.isStatic)||(b.plugin.kind==="ice"&&!a.isStatic)){pr.friction=0;pr.frictionStatic=0;}}}
function onHit(ev){
  iceLine(ev);rubberHit(ev);
  for(const pr of ev.pairs){
    MODE.onHit(pr.bodyA,pr.bodyB);
    for(const [a,b] of [[pr.bodyA,pr.bodyB],[pr.bodyB,pr.bodyA]]){
      const r=a.parent;if(!r.plugin.rock&&!r.plugin.bee||r.plugin.dead)continue;
      const o=b.parent;
      if(cars.some(c=>!c.waiting&&!L.nocar&&(o===c.chassis||o===c.wA||o===c.wB))||(cargo&&o===cargo)||o.plugin.guy){
        if(state==="draw"||state==="go")finish(false,r.plugin.bee?"ハチに刺された！":r.plugin.big?"大岩にぶつかっちゃった！":"落石にあたっちゃった！");}
      else if(o.isStatic&&!r.plugin.big){r.plugin.dead=true;}
    }
  }
}

function makeCar(x,y,waiting,sz=1){
  const g=Body.nextGroup(true),f={group:g};
  const chassis=Bodies.rectangle(x,y,96*sz,26*sz,{collisionFilter:f,density:.003,friction:.4,chamfer:{radius:9*sz}});
  const wopt={collisionFilter:f,density:.004,friction:1,frictionStatic:8,restitution:0};
  const wA=Bodies.circle(x-32*sz,y+WY*sz,WR*sz,wopt),wB=Bodies.circle(x+32*sz,y+WY*sz,WR*sz,wopt);
  const cA=Constraint.create({bodyA:chassis,pointA:{x:-32*sz,y:WY*sz},bodyB:wA,length:0,stiffness:.6,damping:.1});
  const cB=Constraint.create({bodyA:chassis,pointA:{x:32*sz,y:WY*sz},bodyB:wB,length:0,stiffness:.6,damping:.1});
  const c={chassis,wA,wB,cons:[cA,cB],drive:0,waiting:!!waiting,x0:x,y0:y,sz};
  if(!waiting)Composite.add(world,[chassis,wA,wB,cA,cB]);
  return c;
}

/* ---------- 線を描く ---------- */
function inNoDraw(p){return (L.noDraw||[]).some(([x,y,w,h])=>p.x>=x-T/2&&p.x<=x+w+T/2&&p.y>=y-T/2&&p.y<=y+h+T/2);}
function blocked(a,b){
  if(b.x<T||b.x>W-T||b.y<T||b.y>H-T)return true;
  const bodies=Composite.allBodies(world);
  const bb=(a.x===b.x&&a.y===b.y)?{x:b.x+.5,y:b.y}:b;
  if(Query.ray(bodies,a,bb,T+2).length)return true;
  const n=Math.max(1,Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)/6));
  for(let k=0;k<=n;k++){const t=k/n;if(inNoDraw({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t}))return true;}
  return false;
}
let lastDrawSfx=0;
function beginDraw(p){
  if(state!=="draw"||strokes.length)return;   // 線は一本だけ
  if(blocked(p,p)){drawing={pts:[],len:0,pending:true};return;}
  drawing={pts:[p],len:0};
}
function moveDraw(p){
  if(!drawing)return;
  if(drawing.pending){ if(!blocked(p,p)){drawing={pts:[p],len:0};} return; }
  const a=drawing.pts[drawing.pts.length-1];
  let d=Math.hypot(p.x-a.x,p.y-a.y);if(d<SEG)return;
  if(L.ink&&drawing.len+d>L.ink)return;   // インクの量が決まっている面
  if(blocked(a,p))return;
  drawing.pts.push(p);drawing.len+=d;
  if(drawing.len-lastDrawSfx>40){lastDrawSfx=drawing.len;sfx.draw();}
}
function endDraw(){
  if(!drawing)return;const dr=drawing;drawing=null;lastDrawSfx=0;
  if(dr.pending||dr.pts.length<2)return;   // 点だけ（タップ）は無かった事にして描き直せる
  const pts=dr.pts;
  const parts=[];
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1],len=Math.hypot(b.x-a.x,b.y-a.y);
    parts.push(Bodies.rectangle((a.x+b.x)/2,(a.y+b.y)/2,len,T,{angle:Math.atan2(b.y-a.y,b.x-a.x),density:.008}));
  }
  // 端とつなぎ目は丸くする（段差に車輪が乗り上げやすくなる）
  for(const p of pts)parts.push(Bodies.circle(p.x,p.y,T/2,{density:.008}));
  const body=Body.create({parts,friction:.9,frictionStatic:2,restitution:0});
  for(const q of body.parts)q.collisionFilter.category=0x0002;body.collisionFilter.category=0x0002; // 線（飛んでいるおっさんはすり抜ける）
  // Matter は合体物の回りにくさ（慣性）を各部品の中心で足すだけなので、長い線が軽々と回ってしまう。重心からの距離を足して直す
  let I=0;for(const q of body.parts.slice(1))I+=q.inertia+q.mass*((q.position.x-body.position.x)**2+(q.position.y-body.position.y)**2);
  Body.setInertia(body,I);
  lineKind(body);
  body.plugin.pts=pts;body.plugin.c0={x:body.position.x,y:body.position.y};body.plugin.len=dr.len;
  Composite.add(world,body);
  const cons=[];
  for(const pin of pins){
    let best=1e9;
    for(let i=0;i<pts.length-1;i++)best=Math.min(best,segDist(pin,pts[i],pts[i+1]));
    if(best<=PIN_R){
      const c=Constraint.create({pointA:{x:pin.x,y:pin.y},bodyB:body,
        pointB:{x:pin.x-body.position.x,y:pin.y-body.position.y},length:0,stiffness:.4,damping:.05}); // 1 だと暴れる
      Composite.add(world,c);cons.push(c);
    }
  }
  strokes.push({body,cons});sfx.drop();lastStroke={li,pts:pts.map(p=>({x:p.x,y:p.y}))};
  go();   // 指を離した瞬間に発進
}
/* 線の種類（面の line）。世界ごとに線の性質が変わる
   rubber: 上に落ちた物（車・ボール・岩）がはね返る（線自体は柱の上で落ち着く）／ice: 上に乗った物（車・ボール・箱）だけすべる（地面の上では止まっている。坂をすべらせたい時は地面を ice にする）／fixed: 描いた所で止まって落ちない／float: 上へ浮く／heavy: 重い（5 倍） */
const LINE_KIND={rubber:{name:"ゴムの線",col:["#a3164f","#ff7ab0"]},ice:{name:"氷の線",col:["#2a7fb8","#d8f4ff"]},
  fixed:{name:"止まる線",col:["#2b2f36","#a9b2bd"]},float:{name:"浮く線",col:["#b87800","#ffe066"]},heavy:{name:"鉄の線",col:["#15171c","#5d6470"]}};
function lineKind(body){const k=L.line;if(!LINE_KIND[k])return;body.plugin.kind=k;
  if(k==="heavy"){Body.setMass(body,body.mass*5);Body.setInertia(body,body.inertia*5);}
  if(k==="float"){body.frictionAir=.15;Body.setInertia(body,Infinity);} // 描いた傾きのまま回らない（エレベーターの床になる） // ゆっくり浮く（上向きの力は step で重さの 2 倍 = 差し引き 1 倍）
  if(k==="fixed"){Body.setStatic(body,true);body.friction=.9;body.frictionStatic=2;body.restitution=0;}}
// 浮く線に乗って上がっている間は、車はブレーキをかけて待つ（エレベーターと同じ）
function floatRide(c){const fl=strokes.filter(st=>st.body.plugin.kind==="float"&&st.body.velocity.y<-.25).map(st=>st.body);
  return fl.length>0&&Query.collides(c.wA,fl).concat(Query.collides(c.wB,fl)).length>0;}
function segDist(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy;let t=l?((p.x-a.x)*dx+(p.y-a.y)*dy)/l:0;
  t=Math.max(0,Math.min(1,t));return Math.hypot(p.x-a.x-dx*t,p.y-a.y-dy*t);}

/* ---------- 物理の1歩 ---------- */
const DT=1000/60;
// 車輪は力に上限のあるモーターで回す（速度を直接決めると空転して線を押しのけてしまう）
function motor(w,target){
  const d=Math.max(-.03,Math.min(.03,(target-w.angularVelocity)*.3));
  w.torque+=d*w.inertia/(DT*DT);
}
function step(){
  if(!engine)return;
  time+=DT/1000;
  if(state==="go"){
    goT+=DT/1000;
    for(let n=0;n<cars.length;n++){const c=cars[n];
      if(c.waiting){ // 前の車が 160px 進んだら出発
        const prev=cars[n-1];
        if(!prev.waiting&&(prev.chassis.position.x-c.x0)*DIR>160*c.sz){c.waiting=false;c.startT=goT;
          Composite.add(world,[c.chassis,c.wA,c.wB,...c.cons]);sfx.go();}
        continue;}
      if(MODE.driveOff()||(L.cars>1&&(c.chassis.position.x-L.goal[0])*DIR>150)||floatRide(c)){c.drive=0;if(L.nocar||MODE.has("guard")||!MODE.has("flag")){}else{motor(c.wA,0);motor(c.wB,0);}}else if(goT-(c.startT||0)>.45)c.drive=Math.min(.3/c.sz,c.drive+.01);   // ブオーンと吹かしてから走り出す（大きい車も同じ速さ）
      motor(c.wA,c.drive*DIR);motor(c.wB,c.drive*DIR);
      // 段差の手助け（09-30 本人「車が最初に登れない」）: 前の車輪が線の端に下の方で当たって止まっていたら、持ち上げて乗せる
      if(c.drive>.15&&strokes.length&&Math.abs(c.chassis.velocity.x)<1&&goT-(c.stepT||0)>.35){
        const fw=(c.wB.position.x-c.wA.position.x)*DIR>0?c.wB:c.wA;
        const hit=Query.collides(fw,strokes.map(s=>s.body)).find(h=>h.supports&&h.supports[0]&&h.supports[0].y>fw.position.y-2&&(h.supports[0].x-fw.position.x)*DIR>0);
        if(hit){c.stepT=goT;for(const b of [fw,c.chassis])Body.setVelocity(b,{x:b.velocity.x+1.2*DIR,y:Math.min(b.velocity.y,-4.5*c.sz)});}}
      // ジャンプ台: 上を通ると前へ強く押し出される
      for(const [x0,x1,py] of (L.pads||[])){const p=c.chassis.position;
        if(p.x>x0&&p.x<x1&&Math.abs(p.y-(py-(WY+WR)*c.sz))<30){const v=(L.padV||13)*DIR;
          for(const b of [c.chassis,c.wA,c.wB])Body.setVelocity(b,{x:v,y:Math.min(b.velocity.y,-1.5)});if(!c.jumped){c.jumped=1;sfx.go();}}}
    }
  }
  for(const st of strokes){const b=st.body;if(b.plugin.kind==="float"&&!b.isStatic)b.force.y-=b.mass*engine.gravity.y*engine.gravity.scale*2;}
  // 折り返し: 車が L.turn の x を越えたら向きが逆になる（行って戻る面）
  if(L.turn!==undefined&&state==="go"&&!turned&&(car.chassis.position.x-L.turn)*DIR>0){turned=true;DIR=-DIR;sfx.go();}
  if(mill){const d=Math.max(-.004,Math.min(.004,(mill.plugin.speed-mill.angularVelocity)*.3));mill.torque+=d*mill.inertia/(DT*DT);}
  if(boulder&&boulder.position.y>H+200){Composite.remove(world,boulder);boulder=null;}
  // 落石 L.rocks=[x0,x1,間隔(秒)]
  if(L.rocks&&(state==="draw"&&!MODE.has("guard")||state==="go")){
    rockT-=DT/1000;
    if(rockT<=0){rockT=L.rocks[2];const [x0,x1]=L.rocks,rad=13+rockRng()*9;
      const b=Bodies.circle(x0+(x1-x0)*rockRng(),-30,rad,{density:.004,restitution:.2,friction:.5});
      b.plugin.rock=true;Composite.add(world,b);rocks.push(b);}
  }
  for(let i=rocks.length-1;i>=0;i--){const b=rocks[i];
    if(b.plugin.dead||b.position.y>H+100){
      if(b.plugin.dead)for(let k=0;k<8;k++)parts.push({x:b.position.x,y:b.position.y,vx:(Math.random()-.5)*6,vy:-Math.random()*5,t:.6,c:"#8a7a6a"});
      Composite.remove(world,b);rocks.splice(i,1);}}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.t-=DT/1000;if(p.t<=0)parts.splice(i,1);}
  stepBoom();
  for(const p of winFx){p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.vx*=.99;p.r+=.2;}
  Engine.update(engine,DT);rubberApply();
  if(state==="draw"||state==="go")MODE.step();
  // 落ちた線は捨てる
  for(let i=strokes.length-1;i>=0;i--)if(strokes[i].body.position.y>H+600){
    Composite.remove(world,strokes[i].body);strokes[i].cons.forEach(c=>Composite.remove(world,c));strokes.splice(i,1);}
  if(state==="draw"||state==="go"){
    const live=cars.filter(c=>!c.waiting);
    const fallMsg=TH.lava?"溶岩に落ちちゃった…":TH.space?"宇宙に落ちちゃった…":TH.subway?"線路に落ちちゃった…":"車が落ちちゃった…";
    if(live.some(c=>c.chassis.position.y>WATER_Y+60)){finish(false,fallMsg);return;}
    let fl=false;for(const c of live){if(MODE.inGrav(c.chassis))continue;const a=((c.chassis.angle%(2*Math.PI))+3*Math.PI)%(2*Math.PI)-Math.PI;if(Math.abs(a)>1.9)fl=true;}
    flipT=fl?flipT+DT/1000:0;
    if(flipT>1.2){finish(false,"ひっくり返っちゃった…");return;}
    if(cargo){const d=Math.hypot(cargo.position.x-car.chassis.position.x,cargo.position.y-car.chassis.position.y);
      if(cargo.position.y>WATER_Y+60||(state==="go"&&d>160)){finish(false,"荷物を落としちゃった…");return;}}
    if(state==="go"&&MODE.has("flag")){
      const done=(L.turn===undefined||turned)&&cars.every(c=>!c.waiting&&(c.chassis.position.x-L.goal[0])*DIR>0&&c.chassis.position.y<L.goal[1]);
      if(done)winT+=DT/1000;else winT=0;
      MODE.flagDone(winT>.25);
      if(winT>.25){}
      else if(goT>30)finish(false,"時間切れ… 車が進めなかった");
      else{ // 動いている車が 1 台も無いまま 2.5 秒で失敗（穴や壁で詰まった時に待たせない）。動く足場で運ばれている時は動いている扱い
        const pending=live.filter(c=>(L.turn!==undefined&&!turned)||(c.chassis.position.x-L.goal[0])*DIR<0);
        const moving=pending.some(c=>{const p=c.chassis.position,q=c.prevP||p;c.prevP={x:p.x,y:p.y};return Math.hypot(p.x-q.x,p.y-q.y)>=.25;});
        stuckT=(goT>1.5&&pending.length&&!moving&&!MODE.busy())?stuckT+DT/1000:0;
        if(stuckT>2.5)finish(false,"動けなくなっちゃった…");
      }
    }
  }
  if(state==="win"){ // ゴール後はゆっくり止める
    for(const c of cars){if(c.waiting)continue;c.drive*=.95;motor(c.wA,c.drive*DIR);motor(c.wB,c.drive*DIR);}
  }
}

/* ---------- 描画 ---------- */
function render(){
  const sh=shakeT>0?shakeT*22:0;ctx.setTransform(K,0,0,K,(Math.random()-.5)*sh*K,(Math.random()-.5)*sh*K);
  const th=L?TH:THEMES[0],ph=li*1.7; // ph: 面ごとに背景の形を少しずつ変える
  let g;
  if(th.bg){BG[th.bg](th,ph);}else{
  // 空
  g=ctx.createLinearGradient(0,0,0,H);th.sky.forEach((c,k)=>g.addColorStop(k/(th.sky.length-1),c));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  drawSkyDeco(th,ph);
  // 遠くの山
  ctx.fillStyle=th.hill[0];ctx.beginPath();ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=40)ctx.lineTo(x,430-Math.sin(x*.006+1+ph)*70-Math.sin(x*.017+ph*.5)*25);
  ctx.lineTo(W,H);ctx.fill();
  if(th.deco==="snow"){ctx.fillStyle="#ffffffcc";ctx.beginPath();ctx.moveTo(0,H); // 雪の山頂
    for(let x=0;x<=W;x+=40)ctx.lineTo(x,430-Math.sin(x*.006+1+ph)*70-Math.sin(x*.017+ph*.5)*25+(Math.sin(x*.006+1+ph)>.6?0:200));
    ctx.lineTo(W,H);ctx.fill();}
  ctx.fillStyle=th.hill[1];ctx.beginPath();ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=40)ctx.lineTo(x,500-Math.sin(x*.009+3+ph)*50);
  ctx.lineTo(W,H);ctx.fill();
  drawFarDeco(th,ph);
  // 水（火山は溶岩、月は宇宙）
  g=ctx.createLinearGradient(0,WATER_Y,0,H);g.addColorStop(0,th.water[0]);g.addColorStop(1,th.water[1]);
  ctx.fillStyle=g;ctx.fillRect(0,WATER_Y,W,H-WATER_Y);
  if(th.space){ctx.fillStyle="#ffffffaa";for(let k=0;k<40;k++){const x=(k*397)%W,y=WATER_Y+10+(k*131)%110;ctx.fillRect(x,y,2,2);}}
  else{
    ctx.strokeStyle=th.lava?"#ffe06099":"#ffffff88";ctx.lineWidth=3;
    for(let row=0;row<3;row++){ctx.beginPath();
      for(let x=0;x<=W;x+=10){const y=WATER_Y+8+row*34+Math.sin(x*.03+time*(th.lava?1:2)+row)*4;x?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();}
    if(th.lava){ctx.fillStyle="#ffd040";for(let k=0;k<6;k++){const t=(time*.7+k*.37)%1,x=(k*233+li*57)%W;
      ctx.globalAlpha=1-t;ctx.beginPath();ctx.arc(x,WATER_Y+20-t*30,4+t*6,0,7);ctx.fill();}ctx.globalAlpha=1;}
  }}
  if(!L)return;
  // 描けない場所
  for(const [x,y,w,h] of (L.noDraw||[])){
    ctx.save();ctx.fillStyle="#ff3b3b22";ctx.fillRect(x,y,w,h);ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
    ctx.strokeStyle="#ff3b3b55";ctx.lineWidth=6;for(let k=-h;k<w;k+=26){ctx.beginPath();ctx.moveTo(x+k,y+h);ctx.lineTo(x+k+h,y);ctx.stroke();}
    ctx.restore();ctx.strokeStyle="#ff3b3b";ctx.lineWidth=3;ctx.setLineDash([12,8]);ctx.strokeRect(x,y,w,h);ctx.setLineDash([]);}
  // 地面
  for(const b of statics){const poly=b.plugin.poly;if(!poly)continue;
    ctx.beginPath();poly.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();
    const top=Math.min(...poly.map(p=>p[1]));
    g=ctx.createLinearGradient(0,top,0,top+300);g.addColorStop(0,TH.ground[0]);g.addColorStop(1,TH.ground[1]);
    ctx.fillStyle=g;ctx.fill();
    ctx.save();ctx.clip();ctx.fillStyle="#00000018";
    if(!TH.noStripe)for(let y=top+40;y<H;y+=46){ctx.fillRect(-100,y,W+200,8);}
    if(TH.gpat)GPAT[TH.gpat](top);
    if(TH.deco==="moon"){ctx.fillStyle="#00000022";for(let k=0;k<6;k++){ctx.beginPath();ctx.ellipse((k*211+top)%W,top+60+(k*67)%200,26,9,0,0,7);ctx.fill();}}
    if(TH.lava){ctx.strokeStyle="#ff6a0088";ctx.lineWidth=3;for(let k=0;k<5;k++){const x=(k*263+top*3)%W;ctx.beginPath();ctx.moveTo(x,top+30);ctx.lineTo(x+20,top+80);ctx.lineTo(x+5,top+130);ctx.stroke();}}
    if(top>-100&&!TH.noGrass){ctx.fillStyle=TH.grass[0];ctx.fillRect(-100,top,W+200,14);ctx.fillStyle=TH.grass[1];ctx.fillRect(-100,top+14,W+200,5);if(TH.gtop)GPAT[TH.gtop](top);
      if(TH.deco==="candy"){ctx.fillStyle="#ffffff";for(let x=-100;x<W+100;x+=26){ctx.beginPath();ctx.arc(x,top+19,6,0,Math.PI);ctx.fill();}}}
    ctx.restore();
    if(TH.glow){ctx.shadowColor=TH.glow;ctx.shadowBlur=14;}
    ctx.strokeStyle=TH.edge;ctx.lineWidth=TH.edgeW||3;ctx.stroke();ctx.shadowBlur=0;
    if(TH.rough){ctx.save();ctx.translate(2,-1.5);ctx.globalAlpha=.5;ctx.lineWidth=1.5;ctx.stroke();ctx.restore();}}
  MODE.draw();
  // ゴールの旗
  const [gx,gy]=L.goal;if(MODE.flag()){
  ctx.fillStyle="#555";ctx.fillRect(gx-3,gy-110,6,110);
  ctx.save();ctx.translate(gx+3,gy-108);
  for(let r=0;r<3;r++)for(let c=0;c<5;c++){ctx.fillStyle=(r+c)%2?"#222":"#fff";
    const w=Math.sin(time*5+c*.8)*3;ctx.fillRect(c*12,r*12+w,12,12);}
  ctx.restore();}
  // 折り返しの看板（行って戻る面）
  if(L.turn!==undefined){const tx=L.turn,ty=L.turnY||480;ctx.fillStyle="#555";ctx.fillRect(tx-3,ty-90,6,90);
    ctx.fillStyle=turned?"#8a8":"#ffd23f";ctx.strokeStyle="#333";ctx.lineWidth=3;ctx.beginPath();ctx.arc(tx,ty-100,26,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle="#333";ctx.font="bold 30px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("↩",tx,ty-98);ctx.textAlign="left";ctx.textBaseline="alphabetic";}
  // 線
  ctx.lineCap="round";ctx.lineJoin="round";
  for(const s of strokes){const b=s.body,{pts,c0}=b.plugin;
    ctx.save();ctx.translate(b.position.x,b.position.y);ctx.rotate(b.angle);
    if(pts.length===1){ctx.fillStyle="#2a2f45";ctx.beginPath();ctx.arc(0,0,T*.7,0,7);ctx.fill();}
    else{strokePath(pts,-c0.x,-c0.y);}
    ctx.restore();}
  if(L.ink&&state==="draw"){const r=Math.max(0,1-(drawing?drawing.len:0)/L.ink); // インクの残り
    ctx.fillStyle="#0006";ctx.fillRect(W/2-160,64,320,16);ctx.fillStyle=r>.2?"#3fa7ff":"#ff5a4e";ctx.fillRect(W/2-158,66,316*r,12);
    ctx.fillStyle="#fff";ctx.font="bold 14px sans-serif";ctx.textAlign="center";ctx.fillText("インク",W/2,60);ctx.textAlign="left";}
  if(drawing&&drawing.pts.length){
    if(drawing.pts.length===1){ctx.fillStyle="#2a2f45aa";ctx.beginPath();ctx.arc(drawing.pts[0].x,drawing.pts[0].y,T*.7,0,7);ctx.fill();}
    else{ctx.globalAlpha=.7;strokePath(drawing.pts,0,0);ctx.globalAlpha=1;}
  }
  // ヒント（模範解答を点線で）
  // 前に描いた線（やり直した時の目安）
  if(lastStroke&&lastStroke.li===li&&state==="draw"&&!drawing){
    ctx.save();ctx.globalAlpha=.28;strokePath(lastStroke.pts,0,0);ctx.restore();}
  if(showHint&&L.sol&&state==="draw"){
    const a=.8+.2*Math.sin(time*5);
    if(showHint===2){
      ctx.save();ctx.setLineDash([14,12]);ctx.lineWidth=T;ctx.lineCap="round";ctx.lineJoin="round";
      ctx.beginPath();L.sol.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
      ctx.strokeStyle="rgba(120,70,0,.55)";ctx.lineWidth=T+4;ctx.stroke();
      ctx.strokeStyle=`rgba(255,215,60,${a})`;ctx.lineWidth=T-2;ctx.stroke();ctx.restore();}
    const s0=L.sol[0],s1=L.sol[L.sol.length-1];
    for(const [[x,y],t] of [[s0,"ここから"],[s1,"ここまで"]]){
      ctx.fillStyle=`rgba(255,215,60,${a})`;ctx.strokeStyle="#7a4a00";ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,13,0,7);ctx.fill();ctx.stroke();
      ctx.font="bold 20px sans-serif";ctx.textAlign="center";ctx.lineWidth=5;ctx.strokeStyle="#fff";ctx.strokeText(t,x,y-22);ctx.fillStyle="#7a4a00";ctx.fillText(t,x,y-22);ctx.textAlign="left";}}
  // くぎ
  for(const p of pins){
    ctx.fillStyle="#ffffff55";ctx.beginPath();ctx.arc(p.x,p.y,PIN_R,0,7);ctx.fill();
    ctx.fillStyle="#333";ctx.beginPath();ctx.arc(p.x,p.y,8,0,7);ctx.fill();
    ctx.fillStyle="#aaa";ctx.beginPath();ctx.arc(p.x-2,p.y-2,3,0,7);ctx.fill();}
  // ジャンプ台
  for(const [x0,x1,py] of (L.pads||[])){ctx.fillStyle="#ff9f1a";ctx.fillRect(x0,py-8,x1-x0,10);ctx.fillStyle="#fff";
    for(let x=x0+10;x<x1-10;x+=26){const a=DIR>0?x:x+14;ctx.beginPath();ctx.moveTo(a,py-7);ctx.lineTo(a+14*DIR,py-3);ctx.lineTo(a,py+1);ctx.fill();}}
  // 風車
  if(mill){ctx.save();ctx.translate(mill.position.x,mill.position.y);ctx.rotate(mill.angle);const r=L.mill[2];
    ctx.fillStyle="#f4f0e0";ctx.strokeStyle="#6a5a40";ctx.lineWidth=3;
    for(const [w,h] of [[r*2,16],[16,r*2]]){ctx.fillRect(-w/2,-h/2,w,h);ctx.strokeRect(-w/2,-h/2,w,h);}
    ctx.fillStyle="#c0392b";ctx.beginPath();ctx.arc(0,0,10,0,7);ctx.fill();ctx.restore();}
  // 大岩
  if(boulder){ctx.save();ctx.translate(boulder.position.x,boulder.position.y);ctx.rotate(boulder.angle);const r=boulder.circleRadius;
    ctx.fillStyle="#7a6a5a";ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.strokeStyle="#3a2e24";ctx.lineWidth=4;ctx.stroke();
    ctx.strokeStyle="#5a4a3a";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-r*.5,-r*.2);ctx.lineTo(r*.1,r*.3);ctx.lineTo(r*.5,-r*.1);ctx.stroke();ctx.restore();}
  if(!blown&&!MODE.noCar())for(const c of cars)if(!c.waiting)drawCar(c);
  if(cargo){ctx.save();ctx.translate(cargo.position.x,cargo.position.y);ctx.rotate(cargo.angle);
    ctx.fillStyle="#d9a066";ctx.fillRect(-17,-13,34,26);ctx.strokeStyle="#8a5a2a";ctx.lineWidth=3;ctx.strokeRect(-17,-13,34,26);
    ctx.beginPath();ctx.moveTo(-17,-2);ctx.lineTo(17,-2);ctx.stroke();ctx.restore();}
  for(const b of rocks){ctx.save();ctx.translate(b.position.x,b.position.y);ctx.rotate(b.angle);const r=b.circleRadius;
    ctx.fillStyle=TH.lava?"#5a2a1a":"#8a7a6a";ctx.beginPath();
    for(let k=0;k<7;k++){const a=k/7*Math.PI*2,rr2=r*(.85+.15*Math.sin(k*2.3));k?ctx.lineTo(Math.cos(a)*rr2,Math.sin(a)*rr2):ctx.moveTo(Math.cos(a)*rr2,Math.sin(a)*rr2);}
    ctx.closePath();ctx.fill();ctx.strokeStyle="#00000055";ctx.lineWidth=2;ctx.stroke();ctx.restore();}
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.t/.6);ctx.fillStyle=p.c;ctx.fillRect(p.x-3,p.y-3,6,6);}ctx.globalAlpha=1;
  for(const p of winFx){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-6,-3,12,6);ctx.restore();}
  drawBoom();
  if(TH.post)postFx(TH.post);
  if(talkAt){drawTalk(talkAt.c,talkAt.z);talkAt=null;}
  if(failAt){if(!blown){const k=Math.min(1,(time-failAt.t)*4),bob=Math.sin(time*6)*4;
    ctx.save();ctx.translate(failAt.x,failAt.y+bob);ctx.scale(k,k);ctx.fillStyle="#fffffff0";ctx.beginPath();ctx.arc(0,0,44,0,7);ctx.fill();
    ctx.strokeStyle="#ff5a4e";ctx.lineWidth=5;ctx.stroke();ctx.font="52px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(failAt.icon,0,3);ctx.restore();ctx.textAlign="left";ctx.textBaseline="alphabetic";}drawFailWord(failAt);}
  drawCheer();
  // 落石の注意（まだ落ちてこない間も場所が分かるように）
  if(L.rocks){const [x0,x1]=L.rocks;ctx.fillStyle="#ffd23f";ctx.strokeStyle="#6a4a00";ctx.lineWidth=3;
    for(const x of [x0,(x0+x1)/2,x1]){ctx.beginPath();ctx.moveTo(x,8);ctx.lineTo(x-14,34);ctx.lineTo(x+14,34);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.fillStyle="#6a4a00";ctx.fillRect(x-2,15,4,11);ctx.fillRect(x-2,28,4,4);ctx.fillStyle="#ffd23f";}}
  // 2 台目の車は左上に小さく「あと1台」
  const wait=cars.filter(c=>c.waiting).length;
  if(wait){ctx.fillStyle="#0006";rr(18,78,150,40,12);ctx.fill();ctx.fillStyle="#fff";ctx.font="bold 22px sans-serif";ctx.fillText(`🚗 あと${wait}台`,32,106);}
}
// 空の飾り（太陽・月・星・雲・雪）
function drawSkyDeco(th,ph){
  const d=th.deco;
  if(d==="night"||d==="moon"||d==="volcano"&&false){}
  if(d==="night"||d==="moon"){ctx.fillStyle="#fff";for(let k=0;k<70;k++){const x=(k*173+li*31)%W,y=(k*97)%380;
      ctx.globalAlpha=.4+.6*Math.abs(Math.sin(time*1.5+k));ctx.fillRect(x,y,2,2);}ctx.globalAlpha=1;}
  if(d==="night"){ctx.fillStyle="#fff6cc";ctx.beginPath();ctx.arc(1050,110,44,0,7);ctx.fill();ctx.fillStyle=th.sky[0];ctx.beginPath();ctx.arc(1070,98,40,0,7);ctx.fill();}
  if(d==="moon"){ // 地球
    ctx.fillStyle="#3a8ae8";ctx.beginPath();ctx.arc(1040,120,50,0,7);ctx.fill();
    ctx.fillStyle="#5cc443";ctx.beginPath();ctx.ellipse(1025,105,20,14,.5,0,7);ctx.ellipse(1060,135,16,10,-.3,0,7);ctx.fill();}
  if(d==="sunset"){ctx.fillStyle="#ffdd88";ctx.beginPath();ctx.arc(900,360,70,0,7);ctx.fill();}
  if(d==="desert"||d==="island"){ctx.fillStyle="#fff2a0";ctx.beginPath();ctx.arc(1080,100,46,0,7);ctx.fill();}
  if(d==="volcano"){ctx.fillStyle="#ff6a3055";for(let k=0;k<30;k++){const x=(k*211+time*20)%W,y=H-((time*40+k*53)%H);ctx.fillRect(x,y,3,3);}}
  if(d!=="night"&&d!=="moon"&&d!=="volcano"){ // 雲
    ctx.fillStyle=d==="sunset"?"#ffc0a0c0":d==="candy"?"#ffffffe0":"#ffffffd0";
    for(const c of clouds){const x=((c.x+time*12*c.s)%(W+300))-150;
      ctx.beginPath();ctx.ellipse(x,c.y,60*c.s,22*c.s,0,0,7);ctx.ellipse(x+40*c.s,c.y-12*c.s,40*c.s,24*c.s,0,0,7);
      ctx.ellipse(x-38*c.s,c.y-6*c.s,34*c.s,18*c.s,0,0,7);ctx.fill();}}
  if(d==="snow"){ctx.fillStyle="#fff";for(let k=0;k<60;k++){const x=(k*151+Math.sin(time+k)*20)%W,y=(k*83+time*40)%H;ctx.beginPath();ctx.arc(x,y,2.5,0,7);ctx.fill();}}
  if(d==="autumn"){for(let k=0;k<18;k++){const x=(k*181+time*30)%W,y=(k*71+time*50)%H;
      ctx.fillStyle=k%2?"#e8602a":"#f0a030";ctx.save();ctx.translate(x,y);ctx.rotate(time*2+k);ctx.fillRect(-5,-3,10,6);ctx.restore();}}
}
// 遠景の飾り（サボテン・木・ヤシ・火山・キャンディ・ビル）
function drawFarDeco(th,ph){
  const d=th.deco,n=6;
  for(let k=0;k<n;k++){
    const x=((k*223+li*97)%(W+100))-50,base=500-Math.sin(x*.009+3+ph)*50+6;
    ctx.save();ctx.translate(x,base);
    if(d==="desert"){ctx.fillStyle="#5a9a4a";ctx.fillRect(-7,-60,14,60);ctx.fillRect(-24,-40,10,24);ctx.fillRect(-24,-22,20,8);ctx.fillRect(14,-48,10,26);ctx.fillRect(4,-30,20,8);}
    else if(d==="autumn"){ctx.fillStyle="#6a3a1a";ctx.fillRect(-5,-40,10,40);ctx.fillStyle=k%2?"#e8602a":"#f0a030";ctx.beginPath();ctx.arc(0,-55,28,0,7);ctx.fill();}
    else if(d==="clouds"&&k%2){ctx.fillStyle="#6ab04a";ctx.fillRect(-4,-30,8,30);ctx.fillStyle="#4a9a3a";ctx.beginPath();ctx.arc(0,-40,20,0,7);ctx.fill();}
    else if(d==="island"){ctx.strokeStyle="#8a6a3a";ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(10,-40,4,-80);ctx.stroke();
      ctx.fillStyle="#3aa84a";for(let j=0;j<5;j++){ctx.save();ctx.translate(4,-80);ctx.rotate(j*1.25);ctx.beginPath();ctx.ellipse(22,0,24,7,0,0,7);ctx.fill();ctx.restore();}}
    else if(d==="candy"){ctx.fillStyle="#fff";ctx.fillRect(-3,-60,6,60);ctx.fillStyle=["#ff6ab4","#5ad0ff","#ffd23f"][k%3];ctx.beginPath();ctx.arc(0,-70,20,0,7);ctx.fill();
      ctx.strokeStyle="#fff";ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,-70,11,0,5);ctx.stroke();}
    else if(d==="night"){ctx.fillStyle="#141e3a";const h=60+(k*37)%80;ctx.fillRect(-26,-h,52,h);ctx.fillStyle="#ffe680";
      for(let yy=-h+10;yy<-10;yy+=18)for(let xx=-18;xx<18;xx+=14)if((xx*7+yy*3+k)%3)ctx.fillRect(xx,yy,7,9);}
    else if(d==="volcano"&&k===2){ctx.fillStyle="#2a0c08";ctx.beginPath();ctx.moveTo(-160,0);ctx.lineTo(-40,-150);ctx.lineTo(40,-150);ctx.lineTo(160,0);ctx.fill();
      ctx.fillStyle="#ff6a00";ctx.beginPath();ctx.ellipse(0,-150,40,10,0,0,7);ctx.fill();}
    else if(d==="snow"&&k%2){ctx.fillStyle="#2a6a4a";ctx.beginPath();ctx.moveTo(0,-60);ctx.lineTo(-20,0);ctx.lineTo(20,0);ctx.fill();ctx.fillStyle="#fff";ctx.beginPath();ctx.moveTo(0,-60);ctx.lineTo(-8,-36);ctx.lineTo(8,-36);ctx.fill();}
    ctx.restore();
  }
}
function strokePath(pts,ox,oy){
  ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x+ox,p.y+oy):ctx.moveTo(p.x+ox,p.y+oy));
  if(TH.glow){ctx.shadowColor=TH.line[0];ctx.shadowBlur=16;}
  const lc=(LINE_KIND[L&&L.line]||{}).col||TH.line;
  ctx.strokeStyle=lc[0];ctx.lineWidth=T+3;ctx.stroke();ctx.shadowBlur=0;
  ctx.strokeStyle=lc[1];ctx.lineWidth=Math.max(2,T-3);ctx.stroke();
}
function drawCar(cr){
  const c=cr.chassis,z=cr.sz,pal=cr===cars[1]?[TH.car[2]==="#556"?"#ffd23f":"#ffffff",TH.car[0],TH.car[2]]:TH.car;
  ctx.save();ctx.translate(c.position.x,c.position.y);ctx.rotate(c.angle);ctx.scale(z*DIR,z);
  (RIDERS[TH.rider]||RIDERS.car)(...pal);
  ctx.restore();
  for(const w of [cr.wA,cr.wB])drawWheel(w,z);
  if(cr===cars[0])talkAt={c,z};
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);}

/* ---------- ループ ---------- */
let acc=0,last=performance.now();
function loop(now){
  acc+=Math.min(100,now-last);last=now;
  let n=0;while(acc>=DT&&n<5){step();acc-=DT;n++;}
  render();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// iPad の指2本の拡大を止める
["gesturestart","gesturechange"].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
/* ---------- オフライン（ホーム画面に追加した時用） ---------- */
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});

/* ---------- 確認用の窓口（#test の時だけ） ---------- */
if(location.hash==="#test"){
  window.__sw={
    load(i){["titleOv","selOv","resOv"].forEach(id=>$(id).classList.remove("show"));loadLevel(i);},
    tryLevel(o,idx=LEVELS.length){["titleOv","selOv","resOv"].forEach(id=>$(id).classList.remove("show"));const keep=LEVELS[idx];LEVELS[idx]=o;loadLevel(idx);
      if(keep===undefined)LEVELS.length=Math.min(LEVELS.length,idx);else LEVELS[idx]=keep;},
    stroke(pts){beginDraw({x:pts[0][0],y:pts[0][1]});
      for(let i=1;i<pts.length;i++){const [ax,ay]=pts[i-1],[bx,by]=pts[i],n=Math.ceil(Math.hypot(bx-ax,by-ay)/6);
        for(let k=1;k<=n;k++)moveDraw({x:ax+(bx-ax)*k/n,y:ay+(by-ay)*k/n});}
      endDraw();},
    go, step(n){for(let i=0;i<n;i++)step();render();},
    get info(){const lc=cars[cars.length-1],c=lc.waiting?car.chassis:lc.chassis;return {state,x:Math.round(c.position.x),y:Math.round(c.position.y),strokes:strokes.length,goT:+goT.toFixed(2)};},
    get levels(){return LEVELS;},
  };
}
</script>
